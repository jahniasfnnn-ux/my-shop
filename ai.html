<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي - الدعم الفني بالذكاء الاصطناعي</title>
    <link rel="stylesheet" href="style.css?v=7">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* الألوان الثابتة لضمان عدم ظهور الشاشة السوداء */
        body {
            background-color: #0b0c10 !important;
            color: #ffffff !important;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f2833;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00df9a;
        }
        .logo a {
            color: #00df9a;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
        }
        .hero {
            background: linear-gradient(135deg, #1f2833, #0b0c10);
            text-align: center;
            padding: 40px 20px;
        }
        .hero h1 {
            color: #00df9a;
            margin-bottom: 10px;
        }
        .chat-container {
            max-width: 500px;
            margin: 20px auto;
            background-color: #1f2833;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 450px;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }
        .message.bot {
            background-color: #0b0c10;
            color: #ffffff;
            align-self: flex-start;
            border-right: 4px solid #00df9a;
        }
        .message.user {
            background-color: #00df9a;
            color: #000000;
            align-self: flex-end;
            font-weight: bold;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background-color: #0b0c10;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            background: #1f2833;
            border: 1px solid #00df9a;
            color: #ffffff;
            border-radius: 6px;
            margin-left: 10px;
        }
        .chat-send-btn {
            background-color: #00df9a;
            color: #000000;
            border: none;
            padding: 0 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .suggested-tags {
            padding: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background-color: #1f2833;
            border-top: 1px solid #0b0c10;
        }
        .tag-btn {
            background: #0b0c10;
            border: 1px solid #00df9a;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }
        .whatsapp-share-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 8px;
            cursor: pointer;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html"><i class="fa-solid fa-gamepad"></i> متجر الحسابات</a></div>
        <nav>
            <a href="index.html" style="color: #ffffff; text-decoration: none; margin-left: 15px; font-size: 14px;"><i class="fa-solid fa-store"></i> المتجر</a>
            <a href="charge.html" style="color: #ffffff; text-decoration: none; font-size: 14px;"><i class="fa-solid fa-bolt"></i> شحن الألعاب</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1><i class="fa-solid fa-robot"></i> المساعد الفني الذكي (AI)</h1>
            <p>أنا هنا لمساعدتك في حل أي مشكلة فوراً، أو استقبال رأيك وتقييمك لمتجرنا!</p>
        </div>
    </section>

    <main class="chat-container">
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                مرحباً بك! أنا مساعدك الذكي في متجر الحسابات. 🤖<br><br>
                يمكنك سؤالي عن طريقة الاستلام، الضمان، أو كتابة رأيك وتقييمك للمتجر هنا مباشرة!
            </div>
        </div>

        <div class="suggested-tags">
            <button class="tag-btn" onclick="sendSuggested('كيف أستلم الحساب بعد الشراء؟')">📦 طريقة الاستلام</button>
            <button class="tag-btn" onclick="sendSuggested('ما هو ضمان الحسابات؟')">🛡️ شروط الضمان</button>
            <button class="tag-btn" onclick="sendSuggested('أريد كتابة رأيي وتقييمي للمتجر')">⭐ كتابة تقييم ورأي</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="اكتب سؤالك أو رأيك هنا..." onkeypress="handleKeyPress(event)">
            <button class="chat-send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </main>

    <script>
        const messagesContainer = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendSuggested(text) {
            chatInput.value = text;
            sendMessage();
        }

        function sendMessage() {
            const query = chatInput.value.trim();
            if (!query) return;

            appendMessage(query, 'user');
            chatInput.value = '';

            setTimeout(() => {
                const reply = generateAiReply(query);
                appendMessage(reply, 'bot');
            }, 600);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerHTML = text;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function generateAiReply(input) {
            const txt = input.toLowerCase();
            
            if (txt.includes('رأي') || txt.includes('تقييم') || txt.includes('ممتاز') || txt.includes('جميل') || txt.includes('متجر رائع')) {
                if(txt.length > 20) {
                    return `شكراً جزيلاً لك على مشاركتنا رأيك الفخم! 💚<br>
                    اضغط على الزر بالأسفل لإرساله لي عبر الواتساب لنشره في الصفحة الرئيسية:<br>
                    <button class="whatsapp-share-btn" onclick="shareReview('${input}')"><i class="fa-brands fa-whatsapp"></i> إرسال التقييم للواتساب</button>`;
                }
                return "يسعدني جداً استقبال رأيك وتقييمك! فضلاً اكتب تجربتك معنا في رسالة هنا وسأقوم بتحضيرها للنشر فوراً! ⭐";
            }

            if (txt.includes('استلم') || txt.includes('شراء') || txt.includes('طريقة')) {
                return "📦 **طريقة استلام الحسابات الفورية:**<br>عند إتمام طلبك عبر السلة والتحويل للواتساب، سيقوم الدعم الفني بتسليمك معلومات الحساب (Username & Password) والبريد الأساسي لتأمينه بالكامل خلال 5 إلى 15 دقيقة كحد أقصى!";
            }

            if (txt.includes('ضمان') || txt.includes('بند') || txt.includes('سحب')) {
                return "🛡️ **سياسة الضمان:**<br>نوفر **ضمان كامل لمدة 30 يوماً** ضد السحب أو البند المفاجئ. في حال حدوث أي مشكلة، يتم تعويضك بحساب بديل بنفس القيمة أو استرداد أموالك فوراً.";
            }

            if (txt.includes('شحن') || txt.includes('شدات') || txt.includes('جواهر')) {
                return "⚡ **مركز الشحن الفوري:**<br>الشحن يتم مباشرة عبر الـ ID الرسمي الخاص بك. يستغرق من دقيقة إلى 5 دقائق بعد تأكيد الدفع على الواتساب.";
            }

            return `لقد استقبلت استفسارك بخصوص ("${input}"). 🤖<br><br>يمكنك مراجعة نقاط (الاستلام أو الضمان) من الأزرار السريعة بالأسفل، أو توجيهها للدعم الفني البشري مباشرة عبر الواتساب وسنقوم بحلها لك فوراً!`;
        }

        function shareReview(reviewText) {
            let phoneNumber = "249900863926";
            let message = `⭐️ *تقييم ورأي عميل جديد للنشر في الموقع* ⭐️\n\n"${reviewText}"\n\nأرجو إضافته لقسم آراء العملاء في المتجر.`;
            window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        }
    </script>
</body>
</html>
