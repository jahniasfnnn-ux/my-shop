<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my shop | متجر الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --primary-purple: #7c3aed;
            --text-cyan: #06b6d4;
            --text-muted: #9ca3af;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 15px;
        }

        /* الهيدر العلوي */
        .navbar {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #1f2937;
        }

        .nav-right {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-title {
            color: var(--text-cyan);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: lowercase; /* لجعل اسم my shop يظهر بشكل متناسق */
        }

        .nav-links {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a.active {
            color: #10b981;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            color: var(--text-muted);
        }

        .cart-icon {
            position: relative;
            color: #ffffff;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--danger-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* العناوين الرئيسية */
        .hero-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            max-width: 90%;
            margin: 0 auto;
        }

        /* أزرار الفلترة */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }
        
        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        /* كروت عرض المنتجات */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #1f2937;
            padding: 20px;
            position: relative;
        }

        .badge-premium {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--danger-red);
            color: white;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .product-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .product-price {
            color: var(--text-cyan);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-add-cart {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-right">
            <div class="nav-title">
                <i class="fa-solid fa-gamepad"></i> my shop
            </div>
            <div class="nav-links">
                <a href="#"><i class="fa-solid fa-bolt"></i> شحن الألعاب</a>
                <a href="#" class="active"><i class="fa-solid fa-robot"></i> مساعد AI</a>
            </div>
        </div>
        <div class="nav-left">
            <div class="cart-icon">
                <i class="fa-solid fa-shopping-cart"></i>
                <span class="cart-badge">0</span>
            </div>
            <i class="fa-solid fa-gear"></i>
        </div>
    </div>

    <div class="hero-section">
        <h1 class="hero-title">أقوى حسابات الألعاب<br>بأفضل الأسعار</h1>
        <p class="hero-subtitle">تسليم فوري، دعم متواصل، وضمان كامل على كافة الحسابات.</p>
    </div>

    <div class="filter-container">
        <button class="filter-btn active">الكل</button>
        <button class="filter-btn">FC</button>
        <button class="filter-btn">Siege</button>
        <button class="filter-btn">PUBG</button>
        <button class="filter-btn">Free Fire</button>
    </div>

    <div class="products-grid">
        
        <div class="product-card">
            <span class="badge-premium">مميز</span>
            <h2 class="product-title">حساب FC Mobile أسطوري</h2>
            <div class="product-price">$ 150</div>
            <p class="product-desc">تشكيلة قوية مع لاعبين طاقات +100 وجاهز للمنافسة فوراً.</p>
            <button class="btn-add-cart">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
            </button>
        </div>

        <div class="product-card">
            <h2 class="product-title">حساب Rainbow Six Siege</h2>
            <div class="product-price">$ 90</div>
            <p class="product-desc">يحتوي على سكنات نادرة ورانك ممتاز جاهز للعب التنافسي.</p>
            <button class="btn-add-cart">
                <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
            </button>
        </div>

    </div>

    <script>
        const filterButtons = document.querySelectorAll('.filter-btn');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-btn.active').classList.remove('active');
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
