<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WD BEIN | متجر الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --primary-purple: #7c3aed;
            --text-cyan: #06b6d4;
            --text-muted: #9ca3af;
            --danger-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 15px;
        }

        /* الهيدر العلوي */
        .navbar {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #1f2937;
        }

        .nav-right {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-title {
            color: var(--text-cyan);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-links a.active {
            color: #10b981; /* لون أخضر للمساعد البوت */
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            color: var(--text-muted);
        }

        .cart-icon {
            position: relative;
            color: #ffffff;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--danger-red);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 50%;
        }

        /* العناوين الرئيسية */
        .hero-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .hero-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            max-width: 90%;
            margin: 0 auto;
        }

        /* أزرار الفلترة */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            scrollbar-width: none; /* إخفاء شريط التمرير */
        }
        
        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        /* كروت عرض المنتجات */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
