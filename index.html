<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WD BEIN | متجر الحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --primary-purple: #7c3aed;
            --text-cyan: #06b6d4;
            --text-muted: #9ca3af;
            --danger-red: #ef4444;
            --whatsapp-green: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            padding: 15px;
            width: 100%;
        }

        /* الهيدر العلوي */
        .navbar {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border: 1px solid #1f2937;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-title {
            color: var(--text-cyan);
            font-size: 24px;
            font-weight: bold;
        }

        .nav-brand-icon {
            color: var(--text-cyan);
            font-size: 24px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 22px;
            color: #ffffff;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -10px;
            background-color: var(--danger-red);
            color: white;
            font-size: 12px;
            padding: 1px 6px;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        /* أزرار الفلترة للألعاب */
        .filter-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 30px;
            scrollbar-width: none;
        }
        
        .filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #374151;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        /* شبكة المنتجات */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid #1f2937;
            padding: 22px;
            position: relative;
            text-align: right;
        }

        .badge-premium {
            position: absolute;
            top: 18px;
            right: 18px;
            background-color: var(--danger-red);
            color: white;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 6px;
            font-weight: bold;
        }

        .product-title {
            font-size: 22px;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 10px;
        }

        .product-price {
            color: var(--text-cyan);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        /* أزرار التحكم */
        .card-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-add-cart {
            background-color: var(--primary-purple);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-buy-whatsapp {
            background-color: var(--whatsapp-green);
            color: white;
            text-decoration: none
