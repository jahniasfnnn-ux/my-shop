<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز شحن الألعاب الفوري</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">

    <header>
        <div class="logo"><a href="index.html" style="color:inherit; text-decoration:none;"><i class="fa-solid fa-gamepad"></i> متجر الحسابات</a></div>
        <nav>
            <a href="index.html" class="nav-link-btn"><i class="fa-solid fa-store"></i> متجر الحسابات</a>
        </nav>
    </header>

    <section class="hero" style="background: linear-gradient(135deg, #1e3799, #000);">
        <div class="hero-content">
            <h1><i class="fa-solid fa-bolt" style="color: #f1c40f;"></i> مركز الشحن الفوري بالـ ID</h1>
            <p>اشحن شداتك، جواهرك، وعملات FC الآن بأمان وضمان سرعة التسليم.</p>
        </div>
    </section>

    <main class="products-container" style="display: block; max-width: 500px; margin: 30px auto; padding: 20px; background-color: var(--header-bg); border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
        <h2 style="color: var(--accent-color); text-align: center; margin-bottom: 20px;"><i class="fa-solid fa-file-invoice-dollar"></i> طلب شحن جديد</h2>
        
        <form id="charge-form">
            <label style="display:block; margin-bottom: 8px; color: var(--text-color);">اختر اللعبة أو الخدمة:</label>
            <select id="game-select" onchange="updateQuantities()" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--primary-color); color: var(--text-color); border-radius: 6px;" required>
                <option value="" disabled selected>-- اختر اللعبة --</option>
                <option value="fc">FC Mobile (نقاط / كوينز)</option>
                <option value="pubg">PUBG Mobile (شدات UC)</option>
                <option value="freefire">Free Fire (جواهر)</option>
            </select>

            <label style="display:block; margin-bottom: 8px; color: var(--text-color);">معرّف اللاعب (ID):</label>
            <input type="text" id="player-id" placeholder="اكتب الـ ID الخاص بك في اللعبة هنا" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--primary-color); color: var(--text-color); border-radius: 6px;" required>

            <label style="display:block; margin-bottom: 8px; color: var(--text-color);">اسم اللاعب في اللعبة (اختياري):</label>
            <input type="text" id="player-name" placeholder="لتأكيد وصول الشحن للاسم الصحيح" style="width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--primary-color); color: var(--text-color); border-radius: 6px;">

            <label style="display:block; margin-bottom: 8px; color: var(--text-color);">اختر الباقة أو الكمية:</label>
            <select id="quantity-select" style="width: 100%; padding: 12px; margin-bottom: 25px; background: var(--bg-color); border: 1px solid var(--primary-color); color: var(--text-color); border-radius: 6px;" required>
                <option value="" disabled selected>الرجاء اختيار اللعبة أولاً</option>
            </select>

            <button type="submit" style="background-color: #2ecc71; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;"><i class="fa-brands fa-whatsapp"></i> تأكيد الطلب والشحن عبر الواتساب</button>
        </form>
    </main>

    <script>
        // تغيير باقات الشحن والأسعار ديناميكياً حسب اختيار اللعبة
        function updateQuantities() {
            const game = document.getElementById('game-select').value;
            const qtySelect = document.getElementById('quantity-select');
            qtySelect.innerHTML = ''; // تنظيف الخيارات القديمة

            let options = [];

            if (game === 'fc') {
                options = [
                    { text: "5,000 FC Points — 50 $", value: "5000 FC Points (50$)" },
                    { text: "10,000 FC Points — 95 $", value: "10000 FC Points (95$)" },
                    { text: "50 مليون كوينز — 30 $", value: "50M Coins (30$)" },
                    { text: "100 مليون كوينز — 55 $", value: "100M Coins (55$)" }
                ];
            } else if (game === 'pubg') {
                options = [
                    { text: "325 شدة UC — 5 $", value: "325 UC (5$)" },
                    { text: "660 شدة UC — 10 $", value: "660 UC (10$)" },
                    { text: "1800 شدة UC — 25 $", value: "1800 UC (25$)" },
                    { text: "3850 شدة UC — 50 $", value: "3850 UC (50$)" }
                ];
            } else if (game === 'freefire') {
                options = [
                    { text: "100 جوهرة — 1.5 $", value: "100 Diamonds (1.5$)" },
                    { text: "210 جوهرة — 3 $", value: "210 Diamonds (3$)" },
                    { text: "530 جوهرة — 7 $", value: "530 Diamonds (7$)" },
                    { text: "1080 جوهرة — 13 $", value: "1080 Diamonds (13$)" }
                ];
            }

            options.forEach(opt => {
                const el = document.createElement('option');
                el.textContent = opt.text;
                el.value = opt.value;
                qtySelect.appendChild(el);
            });
        }

        // إرسال البيانات المعبأة بشكل منسق للواتساب
        document.getElementById('charge-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const gameName = document.getElementById('game-select').options[document.getElementById('game-select').selectedIndex].text;
            const playerId = document.getElementById('player-id').value;
            const playerName = document.getElementById('player-name').value || "غير محدد";
            const packageSelected = document.getElementById('quantity-select').value;

            let phoneNumber = "249900863926"; 
            let message = "🚀 *طلب شحن جديد من المركز* 🚀\n\n";
            message += `🎮 *اللعبة:* ${gameName}\n`;
            message += `🆔 *الـ ID:* ${playerId}\n`;
            message += `👤 *اسم اللاعب:* ${playerName}\n`;
            message += `💎 *الباقة المطلوبة:* ${packageSelected}\n\n`;
            message += "أرجو تأكيد الاستلام وتزويدي ببيانات الدفع ليرسل الشحن فوراً.";

            window.open(`https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`, '_blank');
        });
    </script>
</body>
</html>
